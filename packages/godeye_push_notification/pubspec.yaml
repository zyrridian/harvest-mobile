name: godeye_push_notification
description: "Production-ready push notification service for Flutter. Supports Firebase FCM (background/terminated) + Socket.IO (real-time foreground) with automatic fallback and pending delivery."
version: 2.0.0
homepage: https://github.com/GodEye2004/push-notification
repository: https://github.com/GodEye2004/push-notification/tree/main/packages/godeye_push_notification

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.1.2
  flutter_background_service: ^5.1.0
  socket_io_client: ^3.1.4
  device_info_plus: ^10.1.0
  http: ^1.6.0
  shared_preferences: ^2.2.2
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

